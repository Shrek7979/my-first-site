<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>허석의 자기소개</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1b2a4a;
      color: #ffffff;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 32px 24px;
    }
    h1 { font-size: clamp(1.8rem, 6vw, 2.4rem); margin-bottom: 4px; }
    .hello { font-size: 1rem; opacity: 0.8; margin-bottom: 28px; }
    h2 {
      font-size: 1.1rem;
      margin: 24px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
    p, li { font-size: 1.05rem; }
    ul { list-style: none; }
    li { padding: 8px 0; }
    li::before { content: "▸ "; opacity: 0.7; }
  </style>
</head>
<body>
  <main class="card">
    <p class="hello">안녕하세요, 저는</p>
    <h1>허석</h1>

    <h2>좋아하는 과목</h2>
    <p>수학</p>

    <h2>취미</h2>
    <ul>
      <li>코딩</li>
      <li>피지컬컴퓨팅</li>
      <li>수학 문제 만들기</li>
    </ul>
  </main>
</body>
</html>
